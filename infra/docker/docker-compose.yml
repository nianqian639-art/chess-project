version: "3.9"
services:
  backend:
    build:
      context: ../../backend
    container_name: chess-backend
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3:8b
      STOCKFISH_SERVICE_URL: http://engine:8081
    ports:
      - "8080:8080"
    depends_on:
      - engine
      - ollama

  engine:
    build:
      context: ../../engine_service
    container_name: chess-engine
    environment:
      PORT: 8081
      HOST: 0.0.0.0
      STOCKFISH_BIN: /usr/games/stockfish
    ports:
      - "8081:8081"

  ollama:
    image: ollama/ollama:latest
    container_name: chess-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  ollama-data:
